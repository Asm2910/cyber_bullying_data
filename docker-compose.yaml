version: "3.8"

services:
  app:
    user: "${USER_ID:-1000}"
    hostname: "${HOST_NAME:-emkademy}"
    image: cyber_bullying_data
    platform: linux/amd64
    container_name: cyber_bullying_data-container
    build:
      context: .
      dockerfile: ./docker/Dockerfile
      args:
        USER_NAME: "${USER_NAME:-kyuksel}"
        USER_ID: "${USER_ID:-1000}"
    volumes:
      - ./:/app/
      - ~/.config/gcloud/:/home/${USER_NAME:-kyuksel}/.config/gcloud
      - ~/.ssh:${HOME}/.ssh
    ports:
      - 8888:8888
    ipc: host
    init: true


